version: "2"

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - copyloopvar
    - misspell
    - revive
    - unconvert
    - unparam
    - wastedassign
    - durationcheck
    - nilerr
    - nilnil
    - modernize
    - exptostd
    - intrange
    - usestdlibvars
    - perfsprint

  settings:
    revive:
      rules:
        - name: atomic
        - name: empty-block
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: waitgroup-by-value

formatters:
  enable:
    - gofumpt # stricter superset of gofmt; covers all gofmt rules plus more
    - goimports # enforce import grouping and ordering
  settings:
    gofumpt:
      extra-rules: true
      module-path: ipgeo
    goimports:
      local-prefixes:
        - ipgeo
