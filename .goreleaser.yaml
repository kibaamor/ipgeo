version: 2
project_name: ipgeo

before:
  hooks:
    - go mod tidy
    - go mod tidy -C ./cmd/ipgeo

builds:
  - id: ipgeo
    main: ./cmd/ipgeo
    binary: ipgeo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.Version={{.Tag}}
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.Commit={{.Commit}}
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# Compress binaries with UPX after building.
upx:
  - enabled: true
    compress: best
    lzma: true
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# Single checksums.txt (SHA-256) covering all release artifacts.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: kibaamor
    name: ipgeo
