version: 2

project_name: ipgeo

changelog:
  use: github

report_sizes: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

upx:
  - ids:
      - ipgeo
    enabled: true
    compress: best
    lzma: true

builds:
  - id: ipgeo
    dir: cmd/ipgeo
    main: .
    binary: ipgeo
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.version={{.Version}}
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.gitCommit={{.ShortCommit}}
      - -X github.com/kibaamor/ipgeo/cmd/ipgeo/cmd.buildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ipgeo
    ids:
      - ipgeo
    files:
      - README.md
      - LICENSE
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - id: ipgeo
    ids:
      - ipgeo
    dockerfile: Dockerfile
    images:
      - ghcr.io/kibaamor/ipgeo
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{.Major}}"
      - latest
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: Resolves IPv4 and IPv6 addresses to geographic and network information.
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/kibaamor/ipgeo
      org.opencontainers.image.title: ipgeo
      org.opencontainers.image.url: https://github.com/kibaamor/ipgeo
      org.opencontainers.image.version: "{{ .Version }}"
